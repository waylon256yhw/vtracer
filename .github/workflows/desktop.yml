name: Desktop

on:
  push:
    branches: [master, studio]
    tags: ['studio-v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'studio-core/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test headless core
        working-directory: .
        run: cargo test -p studio-core -p vtracer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Type-check and build frontend
        run: npm run build

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend deps
        working-directory: desktop
        run: npm ci
      - name: Build Tauri app (NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          # On studio-v* tags, also create a GitHub Release with the installer attached.
          tagName: ${{ startsWith(github.ref, 'refs/tags/studio-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/studio-v') && format('VTracer Studio {0}', github.ref_name) || '' }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtracer-studio-windows-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
