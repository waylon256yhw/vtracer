[package]
name = "studio-core"
version = "0.1.0"
edition = "2021"
description = "Headless core logic for VTracer Studio (param matrix, recipes, thumbnails)."
license = "MIT"
publish = false

[dependencies]
vtracer = { path = "../cmdapp" }
visioncortex = "0.8.8"
image = "0.25"
resvg = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "pure" (pure-Rust) keeps the crate checkable/cross-compilable without a
# target C toolchain; hashing speed is irrelevant at our call frequency.
blake3 = { version = "1.8", features = ["pure"] }
crossbeam-channel = "0.5"
thiserror = "2"
